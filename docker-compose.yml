name: lumys

services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumys
      POSTGRES_USER: lumys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumys -d lumys"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shared memory MCP (port 3100) ───────────────────────────────────────────
  mcp-memory:
    build: ./mcp-memory
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
    depends_on:
      postgres:
        condition: service_healthy

  # ── HR MCP tools — Google Calendar/Gmail/Sheets/Reminders (port 3200) ───────
  mcp-hr:
    build: ./mcp-hr
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      MCP_HR_PORT: "3200"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      CANDIDATE_SHEET_ID: ${CANDIDATE_SHEET_ID:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    volumes:
      - ./secrets:/secrets
    depends_on:
      postgres:
        condition: service_healthy

  # ── Scout MCP — sourcing/recruiting tools (port 3400) ───────────────────────
  mcp-scout:
    build: ./mcp-scout
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      MCP_PORT: "3400"
      CANDIDATE_SHEET_ID: ${CANDIDATE_SHEET_ID:-}
      RESEARCH_SHEET_ID: ${RESEARCH_SHEET_ID:-}
      GOOGLE_SECRETS_DIR: /app/secrets
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      PROXYCURL_API_KEY: ${PROXYCURL_API_KEY:-}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Argus MCP — Instagram competitor tools (port 3500) ──────────────────────
  mcp-argus:
    build: ./mcp-argus
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      MCP_PORT: "3500"
      GOOGLE_CREDENTIALS_FILE: /app/secrets/google_credentials.json
      GOOGLE_SPREADSHEET_ID: ${ARGUS_SHEET_ID:-}
    volumes:
      - ./secrets:/app/secrets:ro
      - ./competitors.yml:/app/competitors.yml
    depends_on:
      postgres:
        condition: service_healthy

  # ── Sirius MCP — content/Notion/PDF/Banner tools (port 3600) ────────────────
  mcp-sirius:
    build: ./mcp-sirius
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      MCP_PORT: "3600"
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      SIRIUS_DRIVE_FOLDER_ID: ${SIRIUS_DRIVE_FOLDER_ID:-}
      RESEARCH_SHEET_ID: ${RESEARCH_SHEET_ID:-}
      GOOGLE_SECRETS_DIR: /app/secrets
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Orchestrator — single Telegram entry point ───────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_TOKEN_1: ${CLAUDE_TOKEN_1:-}
      CLAUDE_TOKEN_2: ${CLAUDE_TOKEN_2:-}
      ROUTER_MODEL: ${ROUTER_MODEL:-claude-haiku-4-5-20251001}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_MAX_TURNS: ${CLAUDE_MAX_TURNS:-20}
      MCP_MEMORY_URL: http://mcp-memory:3100/mcp
      MCP_HR_URL: http://mcp-hr:3200/mcp
      MCP_SCOUT_URL: http://mcp-scout:3400/mcp
      MCP_ARGUS_URL: http://mcp-argus:3500/mcp
      MCP_SIRIUS_URL: http://mcp-sirius:3600/mcp
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - mcp-memory
      - mcp-hr
      - mcp-scout
      - mcp-argus
      - mcp-sirius

  # ── HR Scout cron — Djinni/DOU/LinkedIn X-Ray ───────────────────────────────
  scout-hr:
    build: ./scout
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DIGEST_CHAT_ID: ${TELEGRAM_DIGEST_CHAT_ID}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SCOUT_CRON: ${SCOUT_CRON:-0 9 * * 1}
      SCOUT_RUN_ON_START: ${SCOUT_RUN_ON_START:-false}
    volumes:
      - ./vacancies.yml:/app/vacancies.yml:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Instagram Scout cron — competitor reels ──────────────────────────────────
  scout-ig:
    build: ./scout-ig
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lumys:${POSTGRES_PASSWORD}@postgres:5432/lumys
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DIGEST_CHAT_ID: ${TELEGRAM_DIGEST_CHAT_ID}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SCOUT_CRON: ${IG_SCOUT_CRON:-0 6 * * 1}
      ARGUS_ANALYSIS_CRON: ${ARGUS_ANALYSIS_CRON:-0 8 * * 1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      ARGUS_SHEET_ID: ${ARGUS_SHEET_ID:-}
      GOOGLE_CREDENTIALS_FILE: /app/secrets/google_credentials.json
    volumes:
      - ./competitors.yml:/app/competitors.yml:ro
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
