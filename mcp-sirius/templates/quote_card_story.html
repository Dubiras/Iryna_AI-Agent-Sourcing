<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: {{ background_color | default('#f4ede0') }};
    color: {{ text_color | default('#1a1a1a') }};
  }
  .card {
    width: 100%; height: 100%;
    padding: 120px 90px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex; flex-direction: column; gap: 0;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: {{ accent_color | default('#c97b4b') }};
    opacity: 0.7;
    margin-bottom: 60px;
  }
  .mark {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 260px;
    line-height: 0.6;
    color: {{ accent_color | default('#c97b4b') }};
    opacity: 0.25;
    user-select: none;
  }
  .center {
    flex: 1;
    display: flex; align-items: center;
    padding: 60px 0;
  }
  .quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    line-height: 1.25;
    font-weight: 400;
  }
  .bottom {
    display: flex; flex-direction: column; gap: 10px;
    border-top: 2px solid {{ accent_color | default('#c97b4b') }};
    padding-top: 40px;
  }
  .author {
    font-family: 'Inter', sans-serif;
    font-size: 30px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: {{ accent_color | default('#c97b4b') }};
  }
  .handle {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    opacity: 0.4;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    {% if eyebrow %}<div class="eyebrow">{{ eyebrow }}</div>{% endif %}
    <div class="mark">"</div>
  </div>
  <div class="center">
    <div class="quote">{{ quote }}</div>
  </div>
  <div class="bottom">
    {% if author %}<div class="author">{{ author }}</div>{% endif %}
    {% if handle %}<div class="handle">{{ handle }}</div>{% endif %}
  </div>
</div>
</body>
</html>
