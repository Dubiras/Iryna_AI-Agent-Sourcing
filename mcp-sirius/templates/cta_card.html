<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(
      135deg,
      {{ gradient_from | default('#fce6c4') }} 0%,
      {{ gradient_to | default('#f0a060') }} 100%
    );
    color: {{ text_color | default('#1a1a1a') }};
  }
  .card {
    width: 100%; height: 100%;
    padding: 100px 80px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; flex-direction: column; gap: 28px; }
  .badge {
    display: inline-block;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 10px 22px;
    border-radius: 100px;
    align-self: flex-start;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 90px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.02em;
  }
  .subline {
    font-family: 'Inter', sans-serif;
    font-size: 28px;
    line-height: 1.5;
    opacity: 0.75;
    max-width: 80%;
  }
  .bottom { display: flex; flex-direction: column; gap: 16px; }
  .cta {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 36px;
    display: flex; align-items: center; gap: 16px;
  }
  .cta::after {
    content: '→';
    font-style: normal;
    font-size: 32px;
  }
  .handle {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    opacity: 0.45;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    {% if badge %}<div class="badge">{{ badge }}</div>{% endif %}
    <h1>{{ title }}</h1>
    {% if subline %}<p class="subline">{{ subline }}</p>{% endif %}
  </div>
  <div class="bottom">
    <div class="cta">{{ cta_text }}</div>
    {% if handle %}<div class="handle">{{ handle }}</div>{% endif %}
  </div>
</div>
</body>
</html>
