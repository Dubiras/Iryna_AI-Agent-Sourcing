<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: {{ background_color | default('#0f0f0f') }};
    color: {{ text_color | default('#f5f5f5') }};
  }
  .card {
    width: 100%; height: 100%;
    padding: 90px 80px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; flex-direction: column; gap: 20px; }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: {{ accent_color | default('#f0a060') }};
    opacity: 0.8;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 78px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .tips {
    list-style: none;
    display: flex; flex-direction: column; gap: 0;
    counter-reset: tip-counter;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .tips li {
    counter-increment: tip-counter;
    display: flex; align-items: flex-start; gap: 28px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    line-height: 1.45;
  }
  .tips li::before {
    content: counter(tip-counter, decimal-leading-zero);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: {{ accent_color | default('#f0a060') }};
    min-width: 44px;
    padding-top: 3px;
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-top: 24px;
  }
  .footer, .handle {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    opacity: 0.4;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    {% if eyebrow %}<div class="eyebrow">{{ eyebrow }}</div>{% endif %}
    <h1>{{ title }}</h1>
  </div>
  <ul class="tips">
    {% for tip in tips %}
    <li>{{ tip }}</li>
    {% endfor %}
  </ul>
  <div class="bottom">
    <span class="footer">{{ footer | default('') }}</span>
    <span class="handle">{{ handle | default('') }}</span>
  </div>
</div>
</body>
</html>
