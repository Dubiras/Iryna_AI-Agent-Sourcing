<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: {{ background_color | default('#0f0f0f') }};
    color: {{ text_color | default('#f5f5f5') }};
  }
  .header {
    background: {{ accent_color | default('#f0a060') }};
    color: #0f0f0f;
    padding: 100px 80px 80px;
    display: flex; flex-direction: column; gap: 24px;
    flex-shrink: 0;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    opacity: 0.65;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.02em;
  }
  .body {
    flex: 1;
    padding: 0 80px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .tips {
    list-style: none;
    display: flex; flex-direction: column;
    counter-reset: tip-counter;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .tips li {
    counter-increment: tip-counter;
    display: flex; align-items: flex-start; gap: 32px;
    padding: 36px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-family: 'Inter', sans-serif;
    font-size: 30px;
    line-height: 1.45;
  }
  .tips li::before {
    content: counter(tip-counter, decimal-leading-zero);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: {{ accent_color | default('#f0a060') }};
    min-width: 48px;
    padding-top: 4px;
  }
  .footer-bar {
    padding: 40px 80px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .footer, .handle {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    opacity: 0.35;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    {% if eyebrow %}<div class="eyebrow">{{ eyebrow }}</div>{% endif %}
    <h1>{{ title }}</h1>
  </div>
  <div class="body">
    <ul class="tips">
      {% for tip in tips %}
      <li>{{ tip }}</li>
      {% endfor %}
    </ul>
  </div>
  <div class="footer-bar">
    <span class="footer">{{ footer | default('') }}</span>
    <span class="handle">{{ handle | default('') }}</span>
  </div>
</div>
</body>
</html>
