<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(
      170deg,
      {{ gradient_from | default('#fce6c4') }} 0%,
      {{ gradient_to | default('#e07830') }} 100%
    );
    color: {{ text_color | default('#1a1a1a') }};
  }
  .card {
    width: 100%; height: 100%;
    padding: 120px 80px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; flex-direction: column; gap: 32px; }
  .badge {
    display: inline-block;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 12px 28px;
    border-radius: 100px;
    align-self: flex-start;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 110px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.02em;
  }
  .subline {
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    line-height: 1.5;
    opacity: 0.7;
  }
  .middle {
    flex: 1;
    display: flex; align-items: center;
  }
  .detail {
    font-family: 'Inter', sans-serif;
    font-size: 28px;
    line-height: 1.6;
    opacity: 0.65;
    max-width: 90%;
  }
  .bottom { display: flex; flex-direction: column; gap: 20px; }
  .cta {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 48px;
    display: flex; align-items: center; gap: 20px;
  }
  .cta::after {
    content: '→';
    font-style: normal;
    font-size: 44px;
  }
  .handle {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    opacity: 0.4;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    {% if badge %}<div class="badge">{{ badge }}</div>{% endif %}
    <h1>{{ title }}</h1>
    {% if subline %}<p class="subline">{{ subline }}</p>{% endif %}
  </div>
  {% if detail %}
  <div class="middle">
    <p class="detail">{{ detail }}</p>
  </div>
  {% endif %}
  <div class="bottom">
    <div class="cta">{{ cta_text }}</div>
    {% if handle %}<div class="handle">{{ handle }}</div>{% endif %}
  </div>
</div>
</body>
</html>
